              }
            }

            this.enemies.splice(e, 1);
            if (!enemy.bonus) this.waveEnemiesLeft = Math.max(0, this.waveEnemiesLeft - 1);
            audio.play('explosion');
          } else {
            // Hit but not killed — better feedback
            const hitColor = enemy.hasShield && enemy.shieldHP > 0 ? '#ffaa44' : '#ffffff';
            const hitSize = enemy.hasShield && enemy.shieldHP > 0 ? 1.5 : 1.2;
            this.particles.emit(enemy.x, enemy.y, 8, hitColor, 0.8, 0.25, hitSize);
            if (enemy.hasShield && enemy.shieldHP > 0) {
              audio.play('hit');
            }
          }
          break;
        }
      }
    }

    // Enemy bullets vs player
    if (this.player.alive) {
      const pb = this.player.getBounds();
      for (let b = this.enemyBullets.length - 1; b >= 0; b--) {
        const bullet = this.enemyBullets[b];
        if (!bullet.alive) { this.enemyBullets.splice(b, 1); continue; }

        if (
          bullet.x > pb.x && bullet.x < pb.x + pb.w &&
          bullet.y > pb.y && bullet.y < pb.y + pb.h
        ) {
          bullet.alive = false;
          this.enemyBullets.splice(b, 1);
          if (this.player.hit()) {
            this.gameOver();
            return;
          }
          this.particles.emit(this.player.x, this.player.y, 12, '#ffff44', 1.2, 0.3, 2.5);
          this.flash.trigger('#ff4444', 0.3, 0.15);
          this.combo = 1;
          this.comboTimer = 0;
        }
      }
    }

    // Enemy vs player collision
    if (this.player.alive) {
      const pb = this.player.getBounds();
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const enemy = this.enemies[i];
        const eb = enemy.getBounds();
        if (this.checkCollision(pb, eb)) {
          if (this.player.hit()) {
            this.gameOver();
            return;
          }
          this.particles.emit(this.player.x, this.player.y, 15, '#ffff44', 1.2, 0.35, 2.5);
          this.flash.trigger('#ff4444', 0.35, 0.2);
          if (enemy.typeKey !== 'boss') {
            this.particles.emitExplosion(enemy.x, enemy.y, 1);
            this.score += enemy.score * this.combo;
            if (!enemy.bonus) this.waveEnemiesLeft = Math.max(0, this.waveEnemiesLeft - 1);
            this.kills++;
            // Split on death from collision (minis are bonus, don't affect wave counter)
            if (enemy.splitOnDeath) {
              for (let s = 0; s < enemy.splitCount; s++) {
                const angle = (Math.PI * 2 / enemy.splitCount) * s - Math.PI / 2;
                const mini = new Enemy('scout', enemy.x + Math.cos(angle) * 20, enemy.y + Math.sin(angle) * 15, 0.6);
                mini.width = 16; mini.height = 16;
                mini.bonus = true;
                this.enemies.push(mini);
              }
            }
            this.enemies.splice(i, 1);
          }
          this.combo = 1;
          this.comboTimer = 0;
          break;
        }
      }
    }

    // Player vs power-ups
    if (this.player.alive) {
      for (let p = this.powerUps.length - 1; p >= 0; p--) {
        const pu = this.powerUps[p];
        if (!pu.alive) { this.powerUps.splice(p, 1); continue; }
        if (dist(this.player, pu) < pu.radius + 24) {
          this.activatePowerUp(pu.type);
          this.scorePopups.push(new ScorePopup(pu.x, pu.y, pu.cfg.label, pu.cfg.color, 0.9));
          audio.play('powerup');
          pu.collected = true;
          pu.collectTime = 0;
          this.powerUps.splice(p, 1);
        }
      }
    }

    // Cleanup
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      if (!this.enemies[i].alive) {
        if (!this.enemies[i].bonus) this.waveEnemiesLeft = Math.max(0, this.waveEnemiesLeft - 1);
        this.enemies.splice(i, 1);
      }
    }
    for (let i = this.playerBullets.length - 1; i >= 0; i--) {
      if (!this.playerBullets[i].alive) this.playerBullets.splice(i, 1);
    }
    for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
      if (!this.enemyBullets[i].alive) this.enemyBullets.splice(i, 1);
    }
    for (let i = this.powerUps.length - 1; i >= 0; i--) {
      if (!this.powerUps[i].alive) this.powerUps.splice(i, 1);
    }
    for (let i = this.scorePopups.length - 1; i >= 0; i--) {
      if (!this.scorePopups[i].alive) this.scorePopups.splice(i, 1);
    }

    this.updateHUD();
  }

  draw() {
    ctx.clearRect(0, 0, GAME_W, GAME_H);

    // Deep space background
    ctx.fillStyle = '#040818';
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    const shakeOff = this.shake.getOffset();
    ctx.save();
    ctx.translate(shakeOff.x, shakeOff.y);

    this.starfield.draw(ctx);

    // Draw entities
    for (const pu of this.powerUps) pu.draw(ctx);
    for (const enemy of this.enemies) enemy.draw(ctx);
    for (const b of this.playerBullets) b.draw(ctx);
    for (const b of this.enemyBullets) b.draw(ctx);
    if (this.player.alive) this.player.draw(ctx);
    this.particles.draw(ctx);
    for (const sp of this.scorePopups) sp.draw(ctx);

    ctx.restore();

    // Screen flash
    this.flash.draw(ctx);

    // Wave transition banner
    if (this.waveTransition > 0) {
      const alpha = Math.min(this.waveTransition / 0.5, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(0, GAME_H / 2 - 40, GAME_W, 80);
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.strokeRect(0, GAME_H / 2 - 40, GAME_W, 80);
      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 18px "Orbitron", monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.fillText(`WAVE ${this.wave}`, GAME_W / 2, GAME_H / 2 + 6);
      ctx.restore();
    }

    // Vignette
    const vignetteGrad = ctx.createRadialGradient(GAME_W/2, GAME_H/2, GAME_H*0.5, GAME_W/2, GAME_H/2, GAME_H*0.78);
    vignetteGrad.addColorStop(0, 'transparent');
    vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    // Scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.025)';
    for (let y = 0; y < GAME_H; y += 3) {
      ctx.fillRect(0, y, GAME_W, 1);
    }

    // Corner decorations
    const cornerSize = 20;
    const cornerAlpha = 0.25;
    ctx.strokeStyle = `rgba(0, 200, 255, ${cornerAlpha})`;
    ctx.lineWidth = 1.5;
    // Top-left
    ctx.beginPath();
    ctx.moveTo(8, cornerSize); ctx.lineTo(8, 8); ctx.lineTo(cornerSize, 8);
    ctx.stroke();
    // Top-right
    ctx.beginPath();
    ctx.moveTo(GAME_W - cornerSize, 8); ctx.lineTo(GAME_W - 8, 8); ctx.lineTo(GAME_W - 8, cornerSize);
    ctx.stroke();
    // Bottom-left
    ctx.beginPath();
    ctx.moveTo(8, GAME_H - cornerSize); ctx.lineTo(8, GAME_H - 8); ctx.lineTo(cornerSize, GAME_H - 8);
    ctx.stroke();
    // Bottom-right
    ctx.beginPath();
    ctx.moveTo(GAME_W - cornerSize, GAME_H - 8); ctx.lineTo(GAME_W - 8, GAME_H - 8); ctx.lineTo(GAME_W - 8, GAME_H - cornerSize);
    ctx.stroke();
  }

  run(timestamp) {
    if (this.state === 'PLAYING') {
      this.dt = (timestamp - this.lastTime) / 1000;
      this.lastTime = timestamp;
      this.update(this.dt);
    }
    if (this.state === 'MENU') {
      this.menuAnimTime += (timestamp - this.lastTime) / 1000;
      this.lastTime = timestamp;
      this.starfield.update(Math.min((timestamp - this.lastTime) / 1000, 0.05));
    }
    this.draw();
    requestAnimationFrame((t) => this.run(t));
  }
}

// ═══════════════════════════════════════════════
//  INIT & START
// ═══════════════════════════════════════════════
const game = new Game();
requestAnimationFrame((t) => {
  game.lastTime = t;
  game.run(t);
});
